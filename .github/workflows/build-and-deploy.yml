name: CI/CD to ECR + GitOps Update

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.detect.outputs.services }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: detect
        run: |
          SERVICES=""
          
          if git diff --name-only HEAD~1 HEAD | grep -q "^src/ui/"; then
            SERVICES="$SERVICES ui"
          fi
          if git diff --name-only HEAD~1 HEAD | grep -q "^src/catalog/"; then
            SERVICES="$SERVICES catalog"
          fi
          if git diff --name-only HEAD~1 HEAD | grep -q "^src/cart/"; then
            SERVICES="$SERVICES cart"
          fi
          if git diff --name-only HEAD~1 HEAD | grep -q "^src/orders/"; then
            SERVICES="$SERVICES orders"
          fi
          if git diff --name-only HEAD~1 HEAD | grep -q "^src/checkout/"; then
            SERVICES="$SERVICES checkout"
          fi

          echo "Services changed: $SERVICES"
          echo "services=$SERVICES" >> $GITHUB_OUTPUT

      - name: Stop if nothing changed
        if: steps.detect.outputs.services == ''
        run: echo "No services changed. Stopping workflow."

      - name: Configure AWS credentials
        if: steps.detect.outputs.services != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Assume ECR Role
        if: steps.detect.outputs.services != ''
        id: assume
        shell: bash
        run: |
            CREDS=$(aws sts assume-role \
              --role-arn arn:aws:iam::$AWS_ACCOUNT_ID:role/ravid-retail-store-ecr-user-role \
              --role-session-name github)
  
            ACCESS_KEY=$(echo "$CREDS" | sed -n 's/.*"AccessKeyId": "\(.*\)".*/\1/p')
            SECRET_KEY=$(echo "$CREDS" | sed -n 's/.*"SecretAccessKey": "\(.*\)".*/\1/p')
            SESSION_TOKEN=$(echo "$CREDS" | sed -n 's/.*"SessionToken": "\(.*\)".*/\1/p')
  
            echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=$SECRET_KEY" >> $GITHUB_ENV
            echo "AWS_SESSION_TOKEN=$SESSION_TOKEN" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        if: steps.detect.outputs.services != ''
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: true

      - name: Build and Push Images
        if: steps.detect.outputs.services != ''
        run: |
          COMMIT_SHA=${GITHUB_SHA::7}

          for SERVICE in ${{ steps.detect.outputs.services }}; do

            IMAGE_SHA="$ECR_REGISTRY/ravid-retail-store-$SERVICE:$COMMIT_SHA"
            IMAGE_LATEST="$ECR_REGISTRY/ravid-retail-store-$SERVICE:latest"

            echo "-----------------------------------"
            echo "Building image for: $SERVICE"
            echo "SHA Image: $IMAGE_SHA"
            echo "Latest Image: $IMAGE_LATEST"
            echo "-----------------------------------"

            docker build \
              -t $IMAGE_SHA \
              -t $IMAGE_LATEST \
              ./src/$SERVICE

            docker push $IMAGE_SHA
            docker push $IMAGE_LATEST

            echo "Finished uploading $SERVICE"
          done

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: needs.build-and-push.outputs.services != ''

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v3
        with:
          repository: ravidn1224/retail-store-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Get current commit short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Update image tags in GitOps values.yaml
        run: |
          COMMIT_SHA=${GITHUB_SHA::7}

          for SERVICE in ${{ needs.build-and-push.outputs.services }}; do
            FILE="gitops/apps/$SERVICE/values.yaml"

            echo "Updating $FILE with new tag $COMMIT_SHA"

            sed -i "s/tag: \".*\"/tag: \"$COMMIT_SHA\"/" $FILE
          done

      - name: Commit and push changes to GitOps repo
        run: |
          cd gitops
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

          git add .
          git commit -m "Update image tags to ${{ steps.vars.outputs.sha }}"
          git push
