replicaCount: 1
image:
  repository: "630019796862.dkr.ecr.eu-central-1.amazonaws.com/ravid-retail-store-catalog"
  pullPolicy: Always
  tag: latest

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi

livenessProbe:
  path: /ping
  initialDelaySeconds: 20
  periodSeconds: 10

readinessProbe:
  path: /ping
  initialDelaySeconds: 10
  periodSeconds: 10


imagePullSecrets:
  - name: regcred